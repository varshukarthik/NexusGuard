# One-command demo: PostgreSQL + pgvector (private network) and the NovaTech Solutions app (API + built UI).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: novatech
      POSTGRES_PASSWORD: novatech-dev-only
      POSTGRES_DB: novatech
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [private]          # not published to the host — mirrors a private subnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatech"]
      interval: 3s
      retries: 20
  app:
    build: .
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://novatech:novatech-dev-only@db:5432/novatech
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    networks: [private, public]
networks:
  private: { internal: true }
  public: {}
volumes:
  pgdata: {}
